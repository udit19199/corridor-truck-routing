[project]
name = "trips"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<7",
    "gunicorn",
    "requests",
    "whitenoise",
]

[dependency-groups]
dev = [
    "ruff",
    "ty>=0.0.101",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
