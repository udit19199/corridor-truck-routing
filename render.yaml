services:
  - type: web
    name: corridor-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # Deploy a main commit only after its GitHub Actions checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: TOMTOM_API_KEY
        sync: false
