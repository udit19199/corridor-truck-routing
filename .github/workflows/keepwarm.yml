name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.APP_URL != ''
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - run: curl --fail --silent --show-error --retry 2 --retry-delay 20 --max-time 90 "$APP_URL/api/health"
